<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square mark -->
  <rect x="0" y="4" width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- F lettermark — bold, geometric, clean -->
  <!-- Vertical stem -->
  <rect x="15" y="15" width="9" height="38" rx="2" fill="white"/>
  <!-- Top bar (longer) -->
  <rect x="15" y="15" width="32" height="9" rx="2" fill="white"/>
  <!-- Middle bar (shorter) -->
  <rect x="15" y="30" width="22" height="8" rx="2" fill="white" fill-opacity="0.75"/>

  <!-- Wordmark -->
  <text
    x="80"
    y="47"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#0D47A1"
  >FINKING</text>
</svg>
