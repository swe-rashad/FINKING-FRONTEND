<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200" width="100%" height="100%">
  <defs>
    <!-- Ultra-Zəngin Gövdə və Budaq Qradiyentləri -->
    <linearGradient id="treeTrunk" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    
    <linearGradient id="canopyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Maksimal Parıltı və Dərinlik Effekti -->
    <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Şəffaf Arxa Fon -->

  <!-- Maksimum Dərəcədə Sıx, Çoxşaxəli və Hündür Rəqəmsal Ağac Kompozisiyası -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Əsas Gövdə (Trunk & Main Stem - Çox qalın və hündür) -->
    <path d="M800,2100 C800,1650 840,1300 800,950 C760,700 650,550 540,400" stroke="url(#treeTrunk)" stroke-width="70" opacity="0.95" />
    <path d="M800,2100 C800,1650 840,1300 800,950 C760,700 650,550 540,400" stroke="#38bdf8" stroke-width="20" filter="url(#ultraGlow)" opacity="0.85" />

    <!-- Sol Budaqlar (Left Canopy Network - Həddindən artıq sıx şaxələnmə) -->
    <path d="M660,650 C560,560 420,510 280,450 C180,410 90,320 30,190" stroke="url(#canopyGrad)" stroke-width="10" opacity="0.9" />
    <path d="M540,540 C440,440 320,380 180,310 C110,260 60,160 20,70" stroke="#38bdf8" stroke-width="6" opacity="0.85" />
    <path d="M420,490 C320,390 220,290 130,190 C80,130 40,70 10,10" stroke="#2dd4bf" stroke-width="4" opacity="0.8" />
    <path d="M590,600 C480,510 380,430 300,340" stroke="#818cf8" stroke-width="5" opacity="0.75" />
    <path d="M280,410 C200,320 130,230 70,120" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    <path d="M380,370 C290,290 230,210 160,130" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
    <path d="M460,280 C380,200 310,130 240,50" stroke="#2dd4bf" stroke-width="2.5" opacity="0.7" />
    <path d="M190,270 C130,200 80,120 30,40" stroke="#818cf8" stroke-width="2" opacity="0.65" />
    <path d="M310,210 C230,140 170,80 110,10" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
    <path d="M220,340 C160,260 110,180 50,90" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <path d="M490,430 C400,350 320,270 240,180" stroke="#2dd4bf" stroke-width="2.2" opacity="0.65" />
    <path d="M350,290 C270,220 200,150 130,70" stroke="#818cf8" stroke-width="1.8" opacity="0.6" />

    <!-- Mərkəzi Budaqlar (Center Canopy Top - Zirvəyə qədər sıx meşə effekti) -->
    <path d="M680,510 C680,380 650,230 600,110 C570,50 530,10 490,0" stroke="url(#canopyGrad)" stroke-width="11" opacity="0.95" filter="url(#ultraGlow)" />
    <path d="M630,390 C630,260 570,150 510,60 C470,20 430,0 380,0" stroke="#38bdf8" stroke-width="6" opacity="0.85" />
    <path d="M730,420 C770,310 820,210 880,120 C910,70 950,30 990,0" stroke="#2dd4bf" stroke-width="7" opacity="0.9" />
    <path d="M650,250 C680,170 720,90 780,10" stroke="#818cf8" stroke-width="4" opacity="0.8" />
    <path d="M700,170 C750,90 800,40 870,0" stroke="#ffffff" stroke-width="3.5" opacity="0.75" />
    <path d="M570,160 C530,90 490,40 440,0" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
    <path d="M600,280 C630,200 670,120 730,20" stroke="#2dd4bf" stroke-width="3" opacity="0.75" />
    <path d="M530,230 C490,160 450,90 400,10" stroke="#818cf8" stroke-width="2.5" opacity="0.7" />

    <!-- Sağ Budaqlar (Right Canopy Network - Həddindən artıq zəngin və geniş) -->
    <path d="M710,610 C810,540 940,490 1070,450 C1160,420 1260,340 1330,240" stroke="url(#canopyGrad)" stroke-width="10" opacity="0.9" />
    <path d="M790,530 C890,450 1000,380 1110,300 C1190,250 1280,170 1340,90" stroke="#38bdf8" stroke-width="6" opacity="0.85" />
    <path d="M920,480 C1020,400 1120,320 1210,230 C1280,170 1340,110 1420,40" stroke="#2dd4bf" stroke-width="4" opacity="0.8" />
    <path d="M750,560 C850,490 930,410 1010,330" stroke="#818cf8" stroke-width="5" opacity="0.75" />
    <path d="M1100,320 C1190,260 1280,170 1370,70" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    <path d="M1000,360 C1080,290 1160,220 1240,160" stroke="#818cf8" stroke-width="2.5" opacity="0.7" />
    <path d="M1070,250 C1150,190 1230,120 1310,60" stroke="#ffffff" stroke-width="2.2" opacity="0.65" />
    <path d="M880,310 C970,250 1050,170 1140,110" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />
    <path d="M960,190 C1040,130 1120,80 1210,30" stroke="#2dd4bf" stroke-width="2" opacity="0.6" />
    <path d="M1120,210 C1200,150 1280,90 1360,20" stroke="#818cf8" stroke-width="2" opacity="0.6" />
    <path d="M840,430 C930,360 1010,280 1090,200" stroke="#38bdf8" stroke-width="2.5" opacity="0.65" />
    <path d="M1020,280 C1100,220 1180,150 1260,80" stroke="#2dd4bf" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Həddindən Artıq Çoxsaylı Parlaq Rəqəmsal Düyünlər və Terminal Nöqtələri (Nodes) -->
  <g fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#ultraGlow)">
    <circle cx="30" cy="190" r="6" />
    <circle cx="20" cy="70" r="5.5" />
    <circle cx="10" cy="10" r="6" />
    <circle cx="130" cy="190" r="7" fill="#ffffff" />
    <circle cx="70" cy="120" r="5" />
    <circle cx="490" cy="0" r="8" fill="#ffffff" />
    <circle cx="380" cy="0" r="6.5" />
    <circle cx="990" cy="0" r="7" />
    <circle cx="870" cy="0" r="6" />
    <circle cx="780" cy="10" r="6.5" />
    <circle cx="730" cy="20" r="7.5" fill="#ffffff" />
    <circle cx="1330" cy="240" r="6.5" />
    <circle cx="1340" cy="90" r="7" />
    <circle cx="1420" cy="40" r="8.5" fill="#ffffff" />
    <circle cx="1210" cy="230" r="6" />
    <circle cx="1370" cy="70" r="7" />
    <circle cx="1310" cy="60" r="6" />
    <circle cx="240" cy="50" r="5.5" />
    <circle cx="110" cy="10" r="6" />
    <circle cx="1140" cy="110" r="6.5" />
    <circle cx="1210" cy="30" r="6" />
    <circle cx="1360" cy="20" r="6.5" />
    <circle cx="50" cy="90" r="5" />
    <circle cx="240" cy="180" r="5.5" />
    <circle cx="130" cy="70" r="5" />
    <circle cx="1260" cy="80" r="6" />
  </g>
</svg>
