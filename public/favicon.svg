<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fav-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="fav-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <g transform="translate(0.5, 0)">
    <!-- Vertical Spine -->
    <path d="M 4,4 C 4,2.9 4.9,2 6,2 L 10,2 C 11.1,2 12,2.9 12,4 L 12,30 C 12,31.1 11.1,32 10,32 L 6,32 C 4.9,32 4,31.1 4,30 Z" fill="url(#fav-stem)"/>

    <!-- Top Ascending Wing -->
    <path d="M 5,2 L 27.5,2 C 28.6,2 29.2,3.1 28.6,4.0 L 22.5,10.1 C 22.1,10.5 21.6,10.7 21.0,10.7 L 5,10.7 Z" fill="url(#fav-top)"/>

    <!-- Top Wing Edge Highlight -->
    <path d="M 5,2 L 27.5,2 C 28.6,2 29.2,3.1 28.6,4.0 L 27.0,4.0 L 5,4.0 Z" fill="#FFFFFF" opacity="0.45"/>

    <!-- Middle Growth Wing -->
    <path d="M 5,16 L 20.5,16 C 21.6,16 22.2,17.1 21.6,18.0 L 17.0,22.6 C 16.6,23 16.1,23.2 15.5,23.2 L 5,23.2 Z" fill="url(#fav-mid)"/>

    <!-- Depth Shadow -->
    <polygon points="5,23.2 12,23.2 12,25.5 5,23.2" fill="#0F172A" opacity="0.22"/>
  </g>
</svg>
